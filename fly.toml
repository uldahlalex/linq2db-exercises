# fly.toml app configuration file generated for linq2db-exercises on 2026-09-21T21:58:14+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'linq2db-exercises'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB = 'Data Source=/data/library.db'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
